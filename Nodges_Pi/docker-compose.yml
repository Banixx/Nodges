services:
  pi-agent:
    build:
      context: .
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: pi-harness
    working_dir: /workspace
    command: >-
      sh -c 'set -eu;
      mkdir -p /home/.pi;
      touch /home/.pi/gitconfig /home/.pi/git-credentials;
      git config --file /home/.pi/gitconfig user.name "Pi Agent";
      git config --file /home/.pi/gitconfig user.email "pi-agent@localhost";
      git config --file /home/.pi/gitconfig --replace-all credential.helper "";
      git config --file /home/.pi/gitconfig --add credential.helper "store --file /home/.pi/git-credentials";
      git config --file /home/.pi/gitconfig credential.username "$${GITHUB_USERNAME}";
      chmod 600 /home/.pi/gitconfig /home/.pi/git-credentials;
      if [ -n "$${GITHUB_TOKEN:-}" ]; then printf "protocol=https\\nhost=github.com\\nusername=%s\\npassword=%s\\n\\n" "$${GITHUB_USERNAME}" "$${GITHUB_TOKEN}" | GIT_CONFIG_GLOBAL=/home/.pi/gitconfig GIT_CONFIG_NOSYSTEM=1 git credential approve; fi;
      npm install;
      exec npm run dev'
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    ports:
      - "5173:5173"
      # Hinweis: Port 8000 (LightRAG) läuft extern auf Windows.
      # Der Container greift darauf zu via host.docker.internal:8000
    volumes:
      # Das Repo-Verzeichnis im Container
      - ${REPO_PATH:-.}:/workspace
      # Permanenter Speicherort fuer Skills, AGENTS.md und eigene Agent-Dateien (Read-Write)
      - type: bind
        source: ${CUSTOM_PATH:-/home/.pi}
        target: /home/.pi
        read_only: false
      # Optionaler SSH-Agent vom WSL-Host (read-only).
      # HTTPS-Pushes nutzen den persistenten Credential-Speicher unter /home/.pi.
      - type: bind
        source: ${SSH_AUTH_SOCK:-/dev/null}
        target: /ssh-agent
        read_only: true
    env_file:
      - .env
    environment:
      # Pi-Home auf das persistente (/home/.pi, Bind-Mount vom Host) umstellen.
      # Damit bleiben Sessions, Skills und AGENTS.md über Container-Neustarts erhalten
      # und /resume zeigt wieder alle alten Sessions (Standard-Session-Dir ist
      # dann /home/.pi/agent/sessions).
      PI_CODING_AGENT_DIR: /home/.pi/agent
      # Verwendet eine persistente Git-Konfiguration statt des fehlerhaften,
      # temporären VS-Code-Credential-Helpers unter /tmp.
      GIT_CONFIG_GLOBAL: /home/.pi/gitconfig
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_ASKPASS: ""
      SSH_ASKPASS: ""
      GIT_TERMINAL_PROMPT: "1"
      GITHUB_USERNAME: ${GITHUB_USERNAME:-Banixx}
    # Härte: Container darf keine Privilegien erlangen
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Temporäre Dateien nur im RAM
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

