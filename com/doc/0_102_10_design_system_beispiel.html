<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Nodges Design System Beispiel</title>
    <!-- Verweis auf die zentrale CSS Datei von Nodges -->
    <link rel="stylesheet" href="../src/styles/main.css">
    
    <style>
        /* Spezifische Layout-Regeln nur für diese Demo-Seite, um das Panel mittig zu platzieren */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color, #1e1e1c);
            margin: 0;
            color: var(--text-color, #e0e0e0);
            font-family: var(--font-family, 'Inter', system-ui, sans-serif);
        }

        .demo-container {
            position: relative;
            width: 320px;
        }
        
        /* Überschreibt das "position: fixed" aus der main.css, damit es hier frei im Raum schwebt */
        .demo-container .ui-panel {
            position: relative;
            right: auto;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

<div class="demo-container">
    <div class="ui-panel">
        <!-- Kopfbereich -->
        <div class="ui-panel-header">
            <h3>Design System</h3>
            <button class="ui-panel-toggle">▼</button>
        </div>
        
        <!-- Hauptinhalt -->
        <div class="ui-panel-content">
            
            <!-- Schalter (Toggles) Sektion -->
            <section class="panel-section">
                <h4 class="section-header">Schalter (Toggles)</h4>
                
                <div class="checkbox-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <label style="margin: 0; cursor: pointer; color: var(--text-color);">Autonome Expansion</label>
                    <input type="checkbox" class="nodges-toggle" checked>
                </div>
                
                <div class="checkbox-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <label style="margin: 0; cursor: pointer; color: var(--text-muted);">Inaktive Option</label>
                    <input type="checkbox" class="nodges-toggle">
                </div>
            </section>

            <!-- Regler (Sliders) Sektion -->
            <section class="panel-section">
                <h4 class="section-header">Regler (Sliders)</h4>
                
                <div class="slider-row" style="margin-bottom: 12px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                        <span style="font-size: 12px;">Detailgrad</span>
                        <span style="font-size: 12px; color: var(--text-muted); font-family: var(--font-mono);">4.0</span>
                    </div>
                    <input type="range" min="1" max="5" step="1" value="4" style="width: 100%;">
                </div>
            </section>

            <!-- Dropdowns & Textfelder Sektion -->
            <section class="panel-section">
                <h4 class="section-header">Eingabefelder</h4>
                
                <label>Suchbegriff</label>
                <input type="text" placeholder="Suche..." style="width: 100%; padding: 6px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: white; margin-bottom: 10px; box-sizing: border-box;">
                
                <label>Modus Auswahl</label>
                <select style="width: 100%; padding: 6px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: white; margin-bottom: 10px; box-sizing: border-box;">
                    <option>Standard Modus</option>
                    <option>Erweiterter Modus</option>
                </select>
            </section>

            <!-- Aktions-Buttons Sektion -->
            <section class="panel-section" style="margin-bottom: 0;">
                <h4 class="section-header">Aktionen</h4>
                
                <button class="action-button">Primäre Aktion</button>
                <button class="action-button secondary">Sekundäre Aktion</button>
            </section>
            
        </div>
    </div>
</div>

</body>
</html>
