<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Refined A2: Modern Integrated</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #16181d;
            --border-color: #2a2d35;
            --accent-color: #6366f1;
            /* Indigo */
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-ui: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: background 0.5s;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
            color: white;
            border-bottom: 1px solid var(--border-color);
        }

        /* Icon Tabs */
        .icon-tabs {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 0;
        }

        .icon-tab {
            cursor: pointer;
            opacity: 0.5;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            text-transform: uppercase;
        }

        .icon-tab:hover,
        .icon-tab.active {
            opacity: 1;
            color: var(--accent-color);
        }

        .icon-symbol {
            font-size: 18px;
        }

        .content {
            padding: 20px;
            overflow-y: auto;
        }

        /* Modern Controls */
        .group {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .group-title {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .toggle:hover {
            color: var(--text-main);
        }

        /* Custom Switch */
        .switch {
            width: 30px;
            height: 16px;
            background: #333;
            border-radius: 10px;
            position: relative;
            transition: 0.2s;
        }

        .switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        input:checked+.switch {
            background: var(--accent-color);
        }

        input:checked+.switch::after {
            transform: translateX(14px);
        }

        /* Visual Theme Selector */
        .theme-select {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .theme-option:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .theme-option.active {
            border-color: var(--accent-color);
            background: rgba(99, 102, 241, 0.1);
        }

        .theme-bubble {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        /* --- VIEWPORT --- */
        .viewport {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .node {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--panel-bg);
            border: 2px solid var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
            cursor: pointer;
            position: relative;
        }

        /* Quick Context Action */
        .quick-actions {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            display: flex;
            gap: 5px;
            padding: 5px;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .node:hover .quick-actions {
            opacity: 1;
            pointer-events: auto;
            top: -60px;
        }

        .action-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
        }

        .action-icon:hover {
            background: var(--accent-color);
            color: white;
        }

        .node-label {
            margin-top: 60px;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 8px;
            border-radius: 4px;
            opacity: 0.5;
            /* Setting simulation */
        }
    </style>
    <script>
        function setTheme(bg, panel, accent, el) {
            const root = document.documentElement;
            root.style.setProperty('--bg-color', bg);
            root.style.setProperty('--panel-bg', panel);
            root.style.setProperty('--accent-color', accent);

            document.querySelectorAll('.theme-option').forEach(o => o.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</head>

<body>

    <div class="sidebar">
        <div class="header">Nodges</div>

        <div class="icon-tabs">
            <div class="icon-tab">
                <span class="icon-symbol">☊</span>
                <span>Layout</span>
            </div>
            <div class="icon-tab active">
                <span class="icon-symbol">👁</span>
                <span>Ansicht</span>
            </div>
            <div class="icon-tab">
                <span class="icon-symbol">📂</span>
                <span>Dateien</span>
            </div>
        </div>

        <div class="content">

            <div class="group">
                <div class="group-title">Beschriftungen</div>
                <label class="toggle">
                    <span>Immer anzeigen</span>
                    <input type="checkbox" hidden>
                    <div class="switch"></div>
                </label>
                <label class="toggle">
                    <span>Nur bei Hover</span>
                    <input type="checkbox" checked hidden>
                    <div class="switch"></div>
                </label>
                <label class="toggle">
                    <span>Details im Menü</span>
                    <input type="checkbox" checked hidden>
                    <div class="switch"></div>
                </label>
            </div>

            <div class="group">
                <div class="group-title">Farbschema wählen</div>
                <div class="theme-select">
                    <div class="theme-option active" onclick="setTheme('#0f1115', '#16181d', '#6366f1', this)">
                        <div class="theme-bubble" style="background:#0f1115; border:1px solid #444"></div>
                        <span>Original (Dark)</span>
                    </div>
                    <div class="theme-option" onclick="setTheme('#263238', '#37474f', '#80cbc4', this)">
                        <div class="theme-bubble" style="background:#263238"></div>
                        <span>Deep Ocean (Teal)</span>
                    </div>
                    <div class="theme-option" onclick="setTheme('#2e1a2b', '#4a2b45', '#e056fd', this)">
                        <div class="theme-bubble" style="background:#2e1a2b"></div>
                        <span>Midnight (Purple)</span>
                    </div>
                    <div class="theme-option" onclick="setTheme('#1b261b', '#263b26', '#4caf50', this)">
                        <div class="theme-bubble" style="background:#1b261b"></div>
                        <span>Forest (Green)</span>
                    </div>
                    <div class="theme-option" onclick="setTheme('#e5e5e5', '#ffffff', '#333333', this)">
                        <div class="theme-bubble" style="background:#e5e5e5; border:1px solid #ccc"></div>
                        <span style="color:#333">Paper (Light/Grey)</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="viewport">
        <!-- Node with Quick Actions -->
        <div class="node">
            <span style="font-size:10px;">NODE</span>
            <div class="quick-actions">
                <div class="action-icon" title="Zoom">🔍</div>
                <div class="action-icon" title="Edit">✏️</div>
                <div class="action-icon" title="Analyze">📈</div>
            </div>
            <div class="node-label">Entity_124</div>
        </div>
    </div>

</body>

</html>
