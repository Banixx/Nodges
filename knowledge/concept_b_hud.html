<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Concept B: Floating HUD</title>
    <style>
        :root {
            --glass-bg: rgba(20, 20, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --neon-blue: #00f0ff;
            --neon-pink: #ff0055;
            --text-color: #fff;
        }

        body {
            margin: 0;
            background: #000;
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 20% 30%, #1a1a2e 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, #1f1025 0%, transparent 40%);
        }

        /* 3D Scene Mockup */
        .viewport {
            width: 100%;
            height: 100%;
            position: relative;
            background-size: 40px 40px;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* --- THE DOCK (Bottom Bar) --- */
        .hud-dock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            padding: 10px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .dock-item {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .dock-item:hover {
            transform: translateY(-8px) scale(1.1);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .dock-item.active {
            background: var(--glass-highlight);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        /* Icons (mocked with text/emoji for simplicity) */
        .icon-play::before {
            content: "▶";
            color: #0f0;
        }

        .icon-settings::before {
            content: "⚙";
        }

        .icon-layout::before {
            content: "☊";
        }

        .icon-search::before {
            content: "🔍";
        }

        /* --- CONTEXT MENU (Floating near object) --- */
        .context-menu {
            position: absolute;
            top: 30%;
            left: 60%;
            /* Mock position */
            width: 220px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 3px solid var(--neon-blue);
            border-radius: 0 12px 12px 0;
            padding: 0;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            animation: floatIn 0.4s ease-out;
            transform-origin: top left;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .menu-header {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .node-title {
            font-size: 14px;
            font-weight: 700;
            color: white;
            display: block;
        }

        .node-id {
            font-size: 10px;
            color: var(--neon-blue);
            font-family: monospace;
            letter-spacing: 1px;
        }

        .menu-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .action-btn {
            background: transparent;
            border: none;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #ccc;
            padding: 12px;
            font-size: 11px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .action-btn:last-child {
            border-right: none;
        }

        .stat-row {
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
        }

        .stat-val {
            color: white;
            font-family: monospace;
        }

        .connector-line {
            position: absolute;
            top: 20px;
            left: -30px;
            width: 30px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-blue));
        }

        .target-dot {
            position: absolute;
            top: 30%;
            left: 60%;
            margin-top: 17px;
            margin-left: -33px;
            width: 6px;
            height: 6px;
            background: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-blue);
        }
    </style>
</head>

<body>
    <div class="viewport">
        <!-- Mock Content -->

        <!-- The Target Object Highlight -->
        <div class="target-dot"></div>

        <!-- Floating Context Menu aka "Hover Card" -->
        <div class="context-menu">
            <div class="connector-line"></div>
            <div class="menu-header">
                <span class="node-title">Primary_Cluster_A</span>
                <span class="node-id">ID: #8F2A9C</span>
            </div>

            <div class="stat-row">
                <span>Degree</span>
                <span class="stat-val">42</span>
            </div>
            <div class="stat-row">
                <span>Weight</span>
                <span class="stat-val">0.85</span>
            </div>

            <div class="menu-actions">
                <button class="action-btn">Focus</button>
                <button class="action-btn">Expand</button>
                <button class="action-btn" style="color: var(--neon-pink)">Delete</button>
                <button class="action-btn">Edit</button>
            </div>
        </div>

        <!-- Bottom Dock -->
        <div class="hud-dock">
            <div class="dock-item icon-search" title="Search"></div>
            <div class="dock-item active icon-network" title="Filter" style="font-size: 18px">❖</div>
            <div class="dock-item icon-layout" title="Layout"></div>
            <div style="width:1px; background:rgba(255,255,255,0.1); margin: 0 4px;"></div>
            <div class="dock-item icon-play" title="Run Simulation"></div>
            <div class="dock-item icon-settings" title="Settings"></div>
        </div>
    </div>
</body>

</html>
