<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Concept C: Node Aesthetic</title>
    <style>
        :root {
            --hex-bg: rgba(40, 44, 52, 0.9);
            --hex-border: #abb2bf;
            --link-color: #61afef;
            --text-color: #e0e0e0;
        }

        body {
            margin: 0;
            background: #21252b;
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: radial-gradient(#2c313a 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Container for the UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Let clicks pass through empty space */
        }

        /* Hexagon Button Component */
        .hex-btn {
            pointer-events: auto;
            position: absolute;
            width: 80px;
            height: 90px;
            background: var(--hex-bg);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 0.2s, background 0.2s;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            /* Note: shadow doesn't work well with clip-path, usually needs SVG filter */
            border: none;
            /* Clip path hides border, so we use inner shadow or SVG background usually. simulated here simply */
        }

        /* Faking a border for hex */
        .hex-btn::before {
            content: '';
            position: absolute;
            width: 76px;
            height: 86px;
            background: var(--hex-bg);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            z-index: -1;
            background: #282c34;
        }

        .hex-border-facade {
            position: absolute;
            width: 84px;
            height: 94px;
            background: var(--link-color);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            z-index: -2;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .hex-btn:hover {
            transform: scale(1.1);
        }

        .hex-btn:hover .hex-border-facade {
            opacity: 1;
        }

        .hex-icon {
            font-size: 24px;
            margin-bottom: 4px;
            display: block;
        }

        .hex-label {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Connecting Lines (SVG) */
        .connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -10;
        }

        line {
            stroke: var(--link-color);
            stroke-width: 2;
            stroke-dasharray: 5, 5;
            opacity: 0.4;
            animation: dash 30s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: 1000;
            }
        }

        /* Positioning specific buttons */
        #main-menu {
            top: 80%;
            left: 50%;
            margin-left: -40px;
            margin-top: -45px;
        }

        #layout-hex {
            top: 70%;
            left: 45%;
            margin-left: -40px;
        }

        #files-hex {
            top: 70%;
            left: 55%;
            margin-left: -40px;
        }

        #settings-hex {
            top: 80%;
            left: 58%;
            margin-left: -40px;
        }

        #help-hex {
            top: 80%;
            left: 42%;
            margin-left: -40px;
        }
    </style>
</head>

<body>

    <svg class="connections">
        <!-- Lines connecting center to satellites -->
        <line x1="50%" y1="80%" x2="45%" y2="70%" />
        <line x1="50%" y1="80%" x2="55%" y2="70%" />
        <line x1="50%" y1="80%" x2="58%" y2="80%" />
        <line x1="50%" y1="80%" x2="42%" y2="80%" />
    </svg>

    <div class="ui-layer">

        <!-- Main Hub -->
        <div class="hex-btn" id="main-menu">
            <div class="hex-border-facade"></div>
            <span class="hex-icon">★</span>
            <span class="hex-label">MENU</span>
        </div>

        <!-- Satellites -->
        <div class="hex-btn" id="layout-hex">
            <div class="hex-border-facade"></div>
            <span class="hex-icon">☊</span>
            <span class="hex-label">Layout</span>
        </div>

        <div class="hex-btn" id="files-hex">
            <div class="hex-border-facade"></div>
            <span class="hex-icon">📂</span>
            <span class="hex-label">Files</span>
        </div>

        <div class="hex-btn" id="settings-hex">
            <div class="hex-border-facade"></div>
            <span class="hex-icon">⚙</span>
            <span class="hex-label">Setup</span>
        </div>

        <div class="hex-btn" id="help-hex">
            <div class="hex-border-facade"></div>
            <span class="hex-icon">?</span>
            <span class="hex-label">Info</span>
        </div>

    </div>

</body>

</html>
