<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Concept A: Command Center</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #1a1c23;
            --border-color: #2f3342;
            --accent-color: #3b82f6;
            /* Technical Blue */
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --font-ui: 'Inter', system-ui, sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Mockup Scene Background */
        .scene-mockup {
            flex: 1;
            background: radial-gradient(circle at center, #1e2230 0%, #0f1115 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .scene-node {
            width: 12px;
            height: 12px;
            background: var(--accent-color);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 10px var(--accent-color);
        }

        /* COMMAND CENTER SIDEBAR */
        .sidebar {
            width: 300px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.3);
        }

        /* Header Area */
        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            color: #fff;
            text-transform: uppercase;
        }

        .version-badge {
            font-size: 10px;
            background: #2f3342;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: var(--font-mono);
        }

        /* Tabs Navigation */
        .tabs-nav {
            display: flex;
            background: #14161c;
            padding: 4px 4px 0 4px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            border-top: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover {
            color: var(--text-main);
            background: #1f222b;
        }

        .tab.active {
            color: var(--accent-color);
            border-top: 2px solid var(--accent-color);
            background: var(--panel-bg);
            font-weight: 600;
        }

        /* Content Area */
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        /* Section Styling */
        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 20px 0 10px 0;
            font-weight: 700;
            display: flex;
            align-items: center;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
            margin-left: 10px;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        /* Controls */
        .control-group {
            margin-bottom: 12px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .value-display {
            font-family: var(--font-mono);
            color: var(--accent-color);
            font-size: 11px;
        }

        /* Custom Slider */
        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #2f3342;
            border-radius: 2px;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--text-main);
            border: 2px solid var(--panel-bg);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 0 2px var(--accent-color);
        }

        /* Data Grid */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .data-item {
            background: #22252e;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .data-label {
            font-size: 10px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }

        .data-value {
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font-mono);
            color: #fff;
        }

        /* Action Button */
        .btn-primary {
            width: 100%;
            padding: 10px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #2563eb;
        }
    </style>
</head>

<body>

    <div class="scene-mockup">
        <!-- Abstract Nodes -->
        <div class="scene-node" style="top: 40%; left: 40%;"></div>
        <div class="scene-node" style="top: 60%; left: 50%;"></div>
        <div class="scene-node" style="top: 45%; left: 55%;"></div>
        <div
            style="position: absolute; border: 1px dashed #333; width: 250px; height: 150px; top: 38%; left: 38%; border-radius: 10px;">
        </div>
        <div style="color: #444; font-size: 24px; font-weight: bold;">3D VIEWPORT</div>
    </div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="app-title">Nodges <span style="color:var(--accent-color)">//</span> CONFIG</span>
            <span class="version-badge">v0.98.0</span>
        </div>

        <div class="tabs-nav">
            <div class="tab active">LAYOUT</div>
            <div class="tab">FILES</div>
            <div class="tab">SYSTEM</div>
        </div>

        <div class="sidebar-content">
            <!-- Active Tab Content: Layout -->
            <div class="section-title">Status</div>
            <div class="data-grid">
                <div class="data-item">
                    <span class="data-label">ACTIVE NODES</span>
                    <span class="data-value">1,240</span>
                </div>
                <div class="data-item">
                    <span class="data-label">ENERGY</span>
                    <span class="data-value">0.042</span>
                </div>
            </div>

            <div class="section-title">Algorithm</div>
            <select
                style="width: 100%; padding: 8px; background: #22252e; border: 1px solid var(--border-color); color: white; margin-bottom: 15px; border-radius: 4px;">
                <option>Force-Directed (3D)</option>
                <option>Fruchterman-Reingold</option>
                <option>Hierarchical Tree</option>
            </select>

            <div class="section-title">Physics Parameters</div>

            <div class="control-group">
                <div class="label-row">
                    <span>Repulsion</span>
                    <span class="value-display">1200</span>
                </div>
                <input type="range" value="60">
            </div>

            <div class="control-group">
                <div class="label-row">
                    <span>Gravity</span>
                    <span class="value-display">0.05</span>
                </div>
                <input type="range" value="20">
            </div>

            <div class="control-group">
                <div class="label-row">
                    <span>Friction (Damping)</span>
                    <span class="value-display">0.92</span>
                </div>
                <input type="range" value="92">
            </div>

            <button class="btn-primary" style="margin-top: 20px;">
                RUN SIMULATION [ENTER]
            </button>
        </div>
    </aside>

</body>

</html>
