<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Refined A3: Compact Data</title>
    <style>
        :root {
            --bg-color: #000000;
            --sidebar-width: 240px;
            --accent-color: #007acc;
            --text-color: #cccccc;
        }

        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            font-size: 11px;
            height: 100vh;
            display: flex;
        }

        /* --- COMPACT SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background: #111;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .tab-buttons {
            display: flex;
            border-bottom: 1px solid #333;
        }

        .tab-btn {
            flex: 1;
            padding: 6px;
            text-align: center;
            border: none;
            background: #222;
            color: #888;
            cursor: pointer;
        }

        .tab-btn.active {
            background: #333;
            color: white;
            font-weight: bold;
        }

        .scroll-area {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        /* Compact Setting Rows */
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            padding-bottom: 6px;
            border-bottom: 1px dashed #222;
        }

        .setting-label {
            color: #888;
        }

        /* Swatches inline */
        .swatch-row {
            display: flex;
            gap: 4px;
        }

        .tiny-swatch {
            width: 14px;
            height: 14px;
            border-radius: 2px;
            cursor: pointer;
            border: 1px solid #444;
        }

        .tiny-swatch:hover {
            border-color: white;
        }

        /* --- VIEWPORT WITH HUD --- */
        .viewport {
            flex: 1;
            position: relative;
            background: radial-gradient(circle, #222 0%, #000 100%);
        }

        /* Persistent Info HUD */
        .info-hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            pointer-events: none;
            color: #666;
            font-family: monospace;
        }

        /* Node */
        .node {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Tooltip Context */
        .hover-tooltip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(15px, -50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #444;
            padding: 8px;
            border-radius: 4px;
            width: 120px;
            display: none;
        }

        .node:hover+.hover-tooltip,
        .hover-tooltip:hover {
            display: block;
        }

        .tt-title {
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
        }

        .tt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="tab-buttons">
            <button class="tab-btn">Lay</button>
            <button class="tab-btn active">View</button>
            <button class="tab-btn">Data</button>
        </div>

        <div class="scroll-area">
            <div style="font-weight:bold; margin-bottom:10px; color:white;">VISUAL SETTINGS</div>

            <div class="setting-row">
                <span class="setting-label">Labels</span>
                <select style="background:#222; color:#ccc; border:none;">
                    <option>Auto (Hover)</option>
                    <option>Always On</option>
                    <option>Never</option>
                </select>
            </div>

            <div class="setting-row">
                <span class="setting-label">Label Content</span>
                <select style="background:#222; color:#ccc; border:none;">
                    <option>Name</option>
                    <option>ID</option>
                </select>
            </div>

            <div style="font-weight:bold; margin:15px 0 5px 0; color:white;">SCHEMES</div>
            <div class="setting-row">
                <span class="setting-label">Preset</span>
                <div class="swatch-row">
                    <div class="tiny-swatch" style="background:#1a1a1a" title="Grey"></div>
                    <div class="tiny-swatch" style="background:#2c3e50" title="Blue"></div>
                    <div class="tiny-swatch" style="background:#19101f" title="Purple"></div>
                    <div class="tiny-swatch" style="background:#0f1a15" title="Green"></div>
                    <div class="tiny-swatch" style="background:#ccc" title="Light"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="viewport">
        <div class="info-hud">
            FPS: 60<br>
            NODES: 1240
        </div>

        <div class="node"></div>
        <div class="hover-tooltip">
            <span class="tt-title">Node #492</span>
            <div class="tt-row"><span>Type</span><span>User</span></div>
            <div class="tt-row"><span>Conn</span><span>14</span></div>
            <div style="margin-top:5px; border-top:1px solid #444; padding-top:2px;">
                <a href="#" style="color:#007acc; text-decoration:none;">Focus</a>
            </div>
        </div>
    </div>

</body>

</html>
