<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Refined A1: Classic Workbench</title>
    <style>
        :root {
            /* Default Scheme (Nodges Original-ish) */
            --bg-color: #1a1a1a;
            --panel-bg: #222;
            --border-color: #333;
            --accent-color: #3498db;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --font-ui: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 280px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 11px;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .tab.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            font-weight: 600;
            background: var(--panel-bg);
        }

        .tab-content {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
        }

        .hidden {
            display: none;
        }

        /* Controls */
        .section-header {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 20px 0 10px 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .section-header:first-child {
            margin-top: 0;
        }

        .form-row {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .checkbox-row input {
            accent-color: var(--accent-color);
        }

        /* Color Schemes */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .color-swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 4px;
            border: 1px solid #555;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-swatch:hover {
            transform: scale(1.1);
            border-color: white;
        }

        .color-swatch.active {
            border: 2px solid white;
            box-shadow: 0 0 5px white;
        }

        /* --- VIEWPORT --- */
        .viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* Node & Context Menu Simulation */
        .node {
            width: 16px;
            height: 16px;
            background: var(--accent-color);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px var(--accent-color);
            cursor: pointer;
        }

        /* Context Menu */
        .context-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            margin-left: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 160px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            font-size: 12px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            transform: translateY(10px);
        }

        .node:hover+.context-menu,
        .context-menu:hover {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .context-header {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
        }

        .context-item {
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        .context-item:hover {
            background: var(--accent-color);
            color: white;
        }

        /* Label Simulation */
        .node-label {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            pointer-events: none;
            opacity: var(--label-opacity, 0);
            /* Controlled by settings */
            transition: opacity 0.2s;
        }

        .node:hover .node-label {
            opacity: 1;
        }
    </style>
    <script>
        function setScheme(bg, panel, accent) {
            const root = document.documentElement;
            root.style.setProperty('--bg-color', bg);
            root.style.setProperty('--panel-bg', panel);
            root.style.setProperty('--accent-color', accent);
        }

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(d => d.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function toggleLabels(alwaysOn) {
            // Simplified toggle for demo
            document.documentElement.style.setProperty('--label-opacity', alwaysOn ? 1 : 0);
        }
    </script>
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <span>Nodges Pro</span>
            <span style="font-size: 10px; opacity: 0.5; align-self: center;">v1.0</span>
        </div>
        <div class="tabs">
            <div class="tab" onclick="switchTab('tab-layout', this)">LAYOUT</div>
            <div class="tab active" onclick="switchTab('tab-view', this)">ANSICHT</div>
            <div class="tab" onclick="switchTab('tab-data', this)">DATEN</div>
        </div>

        <!-- VIEW TAB -->
        <div id="tab-view" class="tab-content">

            <div class="section-header">Beschriftungen (Labels)</div>
            <label class="checkbox-row">
                <input type="checkbox" onchange="toggleLabels(this.checked)">
                <span>Namen immer anzeigen</span>
            </label>
            <label class="checkbox-row">
                <input type="checkbox" checked>
                <span>Namen bei Mouseover</span>
            </label>
            <label class="checkbox-row">
                <input type="checkbox">
                <span>IDs statt Namen zeigen</span>
            </label>

            <div class="section-header">Farbschema</div>
            <div class="color-grid">
                <!-- 1. Original Dark -->
                <div class="color-swatch active" style="background:#1a1a1a"
                    onclick="setScheme('#1a1a1a', '#222', '#3498db')" title="Nodges Default"></div>
                <!-- 2. Gentle Grey (Slate) -->
                <div class="color-swatch" style="background:#2c3e50"
                    onclick="setScheme('#2c3e50', '#34495e', '#1abc9c')" title="Deep Ocean"></div>
                <!-- 3. Midnight Purple -->
                <div class="color-swatch" style="background:#19101f"
                    onclick="setScheme('#19101f', '#2d1e36', '#9b59b6')" title="Midnight"></div>
                <!-- 4. Forest Obsidian -->
                <div class="color-swatch" style="background:#0f1a15"
                    onclick="setScheme('#0f1a15', '#16261f', '#27ae60')" title="Forest"></div>
                <!-- 5. Neutral Slate -->
                <div class="color-swatch" style="background:#202020"
                    onclick="setScheme('#202020', '#303030', '#bdc3c7')" title="Monochrome"></div>
            </div>

            <div class="section-header">Grafik Performance</div>
            <div class="form-row">
                <span>Kantenschärfe</span>
                <select style="background:#333; color:white; border:none; padding:2px;">
                    <option>Hoch (AA 4x)</option>
                    <option>Mittel</option>
                    <option>Niedrig</option>
                </select>
            </div>

            <label class="checkbox-row">
                <input type="checkbox" checked>
                <span>Glow/Bloom Effekte</span>
            </label>
        </div>

        <!-- OTHER TABS (Placeholder) -->
        <div id="tab-layout" class="tab-content hidden">
            <div class="section-header">Algorithmus</div>
            <div class="checkbox-row">Force Directed</div>
        </div>
        <div id="tab-data" class="tab-content hidden">
            <div class="section-header">Datei Info</div>
        </div>

    </div>

    <div class="viewport">
        <!-- NODE SIMULATION -->
        <div class="node">
            <div class="node-label">Central_Node_01</div>
        </div>

        <!-- CONTEXT MENU (Hidden until hover) -->
        <div class="context-menu">
            <div class="context-header">Central_Node_01</div>
            <div class="context-item">Fokussieren</div>
            <div class="context-item">Nachbarn markieren</div>
            <div class="context-item" style="border-top:1px solid #444">Eigenschaften...</div>
        </div>
    </div>

</body>

</html>
